name: ClickHouse companion image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - clickhouse/**
      - .github/workflows/clickhouse-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: clickhouse
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          push: true
          tags: ghcr.io/codefly-dev/service-signoz-clickhouse:25.12.5-1
